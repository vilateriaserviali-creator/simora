<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMORA — Древо династии</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#e8ddca;--panel:#d8c7ad;--panel2:#cdb99e;--line:#a68f70;--text:#403329;--muted:#756553;--accent:#8c6b55;--sage:#8b9a78;--rose:#b98783;--gold:#b5965a}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 18% 10%,#f0e4d1 0,#e8ddca 38%,#d8c8b0 100%);color:var(--text);min-width:1100px;overflow:hidden}
.app{height:100vh;display:flex}.sidebar{width:238px;flex:none;background:linear-gradient(180deg,#d9c9af,#cbb99c);border-right:1px solid #b39d7e;padding:30px 18px;box-shadow:10px 0 35px #765f4318}
.logo{font-family:Georgia,serif;font-size:28px;font-weight:700;letter-spacing:5px;color:#594636}.subtitle{font-size:12px;color:var(--muted);margin-top:7px;margin-bottom:44px}
.menu{display:grid;gap:7px}.menu button{border:0;background:transparent;color:#675746;padding:13px 14px;border-radius:12px;text-align:left;font-size:14px;cursor:pointer;transition:.2s}.menu button:hover,.menu button.active{background:#bca98b;color:#3f3025;box-shadow:inset 3px 0 #8c6b55}
.main{min-width:0;flex:1;padding:25px 28px}.topbar{height:55px;display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.title{font-family:Georgia,serif;font-size:25px;font-weight:650;color:#4b392d}
.actions{display:flex;gap:9px}.action{border:1px solid #b49d7e;background:#ddceb7;color:#574534;border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:0 6px 18px #765f4318;transition:.2s}.action.primary{background:#8c6b55;border-color:#8c6b55;color:#f5ead9}.action:hover{transform:translateY(-2px);box-shadow:0 9px 22px #765f4330}
.switch{display:flex;padding:4px;background:#d1c0a6;border:1px solid #b29b7c;border-radius:12px;gap:4px}.switch button{border:0;background:transparent;color:#6f5d4c;padding:9px 15px;border-radius:8px;cursor:pointer}.switch button.active{background:#9a896d;color:#fff2e3}
.tree-area{height:calc(100vh - 97px);min-height:600px;position:relative;overflow:hidden;border:1px solid #b8a484;border-radius:24px;background:radial-gradient(circle at 50% 42%,#efe3d0 0,#e4d5bc 48%,#d2bea0 100%);cursor:grab;box-shadow:0 20px 55px #6f573d25}.tree-area.dragging{cursor:grabbing}
.tree-title{position:absolute;z-index:20;top:22px;left:25px}.tree-title h2{font-family:Georgia,serif;font-size:19px;color:#4b392d}.tree-title p{color:var(--muted);font-size:11px;margin-top:5px}.hint{position:absolute;right:24px;bottom:18px;color:#746d78;font-size:11px;z-index:20}
.canvas{position:absolute;width:1500px;height:900px;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;transition:transform .08s linear}.tree-art{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.connection{stroke:#9b8060;stroke-width:1.5;opacity:.32;fill:none;stroke-linecap:round}.connection.soft{stroke:#aa9274;stroke-width:1;opacity:.25}
.node{position:absolute;width:150px;text-align:center;z-index:4;cursor:pointer;user-select:none;transition:filter .2s,transform .2s}.node:hover{filter:brightness(1.16)}.node.selected{filter:brightness(1.2)}
.leaf{width:98px;height:98px;margin:auto;border-radius:54% 46% 52% 48%;background:linear-gradient(145deg,#b8c09d,#9ca987);border:3px solid #7f8d6f;box-shadow:0 12px 28px #70563c35;display:flex;align-items:center;justify-content:center;position:relative;transform:rotate(-2deg)}.leaf:after{content:"";position:absolute;width:18px;height:31px;right:-10px;bottom:-11px;border-radius:3px 100% 3px 100%;background:#594d60;transform:rotate(35deg)}
.avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#c9b49a,#9b8069);border:3px solid #f0dfc6;font-weight:700;font-size:22px;color:#594636;transform:rotate(2deg);box-shadow:0 5px 14px #60472d25}.node.dead .leaf{filter:grayscale(.7);opacity:.65}.node.dead .avatar{background:#39353b}.name{font-family:Georgia,serif;font-size:15px;font-weight:650;margin-top:12px;color:#49372c}.meta{font-size:10px;color:#776452;margin-top:4px}
.evelyn{left:675px;top:55px}.alice{left:335px;top:300px}.james{left:995px;top:300px}.emma{left:330px;top:570px}.noah{left:675px;top:570px}.lily{left:1000px;top:570px}
.profile{position:absolute;right:18px;top:72px;width:245px;background:#e5d7c2ee;border:1px solid #b49c7d;border-radius:17px;padding:17px;z-index:30;backdrop-filter:blur(14px);box-shadow:0 20px 50px #765f4330;opacity:0;transform:translateX(18px);pointer-events:none;transition:.22s}.profile.show{opacity:1;transform:translateX(0);pointer-events:auto}.profile .big{width:58px;height:58px;border-radius:50%;background:#b4aa91;border:2px solid #8f8069;display:grid;place-items:center;font-weight:700;font-size:21px;margin-bottom:11px;color:#554332}.profile h3{font-size:18px}.profile .small{color:var(--muted);font-size:11px;margin-top:4px}.stats{display:grid;gap:8px;margin-top:16px}.stat{padding:9px 10px;border-radius:10px;background:#d5c4aa;font-size:11px;color:#6f5c49}.stat b{color:#4c392c;font-weight:600}
.constellation .leaf{border-radius:50%;width:58px;height:58px;background:#a9b08d;border-color:#7e896d;box-shadow:0 0 25px #8a9a7244}.constellation .avatar{width:42px;height:42px;font-size:15px}.constellation .name,.constellation .meta{margin-top:8px}.starfield{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#8d7b65 1px,transparent 1px),radial-gradient(circle,#a79578 1px,transparent 1px);background-size:137px 137px,211px 211px;background-position:18px 30px,77px 91px;opacity:.16}
.modal{position:fixed;inset:0;background:#5c493755;display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:.2s}.modal.show{opacity:1;pointer-events:auto}.dialog{width:430px;background:#e3d3bc;border:1px solid #b39a79;border-radius:20px;padding:24px;box-shadow:0 30px 90px #0008}.dialog h2{font-size:20px}.dialog p{font-size:12px;color:var(--muted);margin-top:5px;margin-bottom:20px}.form{display:grid;gap:12px}.field label{display:block;font-size:11px;color:#a79eaa;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #b39c7e;background:#d7c6aa;color:#4b392d;border-radius:10px;padding:11px 12px;outline:none}.field input:focus,.field select:focus{border-color:#75627f}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.empty-add{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border:1px solid #4c4053;background:#29232e;color:#eee;border-radius:12px;cursor:pointer}
/* living tree */
.branch{stroke:#80634b;stroke-width:13;fill:none;stroke-linecap:round;filter:drop-shadow(0 8px 10px #70533a35)}
.branch.thin{stroke:#92785d;stroke-width:7}.branch.twig{stroke:#a0876a;stroke-width:4}
.avatar{overflow:hidden;position:relative}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar .initial{display:grid;place-items:center;width:100%;height:100%}
.node.selected .leaf{box-shadow:0 0 0 3px #b5965a66,0 16px 40px #765f4335}
.constellation .branch{stroke:#8c765e;stroke-width:2;filter:drop-shadow(0 0 8px #b5965a44)}
.photo-note{font-size:10px;color:#756c79}

/* SIMORA final botanical composition */
.tree-area{background:radial-gradient(ellipse at 50% 20%,#f0e2cb 0,#e6d4b5 42%,#d4bc98 100%);box-shadow:0 26px 70px #60472d24,inset 0 1px #f7ead5}
.tree-area:before{inset:12px;border:1px solid #a78b6870;box-shadow:inset 0 0 100px #74553418}
.canvas{width:1560px;height:930px}
.tree-art{filter:drop-shadow(0 15px 12px #60472d1b)}
.branch{stroke:#704c35;stroke-width:19;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 7px 7px #5d432d2b)}
.branch.thin{stroke:#866347;stroke-width:10}.branch.twig{stroke:#a07e59;stroke-width:5}
.node{width:180px;z-index:8}
.leaf{width:160px;height:190px;background:none;border:0;box-shadow:none;transform:none}
.avatar{width:112px;height:142px;border-radius:58px 58px 50px 50px;border:5px solid #e0c9a3;background:#b69a78;box-shadow:0 13px 28px #503a282f;overflow:hidden;position:relative;z-index:3}
.avatar:after{content:"";position:absolute;inset:3px;border:1px solid #9b7b52;border-radius:54px 54px 46px 46px;pointer-events:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar .initial{display:grid;place-items:center;width:100%;height:100%;font-family:Georgia,serif;font-size:34px;color:#604934}
.ivy{position:absolute;z-index:5;left:0;top:0;width:160px;height:190px;overflow:visible;pointer-events:none}
.ivy-stem{fill:none;stroke:#506b43;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px #3d302333)}
.ivy-tendril{fill:none;stroke:#71895b;stroke-width:1.8;stroke-linecap:round;opacity:.9}
.ivy-leaves path{fill:#748d5d;stroke:#526b43;stroke-width:1;filter:drop-shadow(0 2px 2px #40312430)}
.ivy-leaves path:nth-child(2n){fill:#91a96f}.ivy-leaves path:nth-child(3n){fill:#607c4d}
.node.dead .ivy-stem{stroke:#7f765f}.node.dead .ivy-leaves path{fill:#91866b;stroke:#746b55}
.node:hover .ivy-stem{stroke:#405d36;stroke-width:4.7}.node:hover .ivy-leaves path{filter:drop-shadow(0 3px 4px #40312442)}
.name{margin-top:-1px;padding:7px 19px 8px;background:linear-gradient(#e6d4b2,#d2b98d);border:1px solid #a7865b;border-radius:6px 6px 11px 11px;box-shadow:0 7px 15px #5a40272a;font-family:Georgia,serif;font-size:14px;color:#49362a}
.meta{font-size:10px;color:#765f47;margin-top:4px}
.node.selected .avatar{border-color:#b2935d;box-shadow:0 0 0 4px #b2935d35,0 16px 30px #4d38273b}
.node.selected .ivy-stem{stroke:#3e5b35}
.evelyn{left:670px;top:35px}.alice{left:315px;top:285px}.james{left:1005px;top:285px}.emma{left:315px;top:565px}.noah{left:670px;top:565px}.lily{left:1005px;top:565px}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="logo">SIMORA</div><div class="subtitle">Древо династии</div><nav class="menu">
<button class="active" data-view="tree">🌳 Дерево</button><button data-view="constellation">✦ Созвездие</button><button>📖 Хроника</button><button>🏆 Достижения</button>
</nav></aside>
<main class="main">
<div class="topbar"><div class="title">Blackwood Legacy</div><div class="actions"><button class="action primary" id="addBtn">＋ Добавить сима</button><div class="switch"><button class="active" data-view="tree">🌳 Дерево</button><button data-view="constellation">✦ Созвездие</button></div></div></div>
<section class="tree-area" id="area"><div class="starfield"></div><div class="tree-title"><h2>Blackwood</h2><p id="counter">3 поколения · 6 персонажей</p></div>
<div class="canvas" id="canvas">
<svg class="tree-art" viewBox="0 0 1500 900" aria-hidden="true">
<defs>
 <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5f432f"/><stop offset=".5" stop-color="#8b6748"/><stop offset="1" stop-color="#60432e"/></linearGradient>
 <filter id="treeShadow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<g opacity=".16" filter="url(#treeShadow)" fill="none" stroke="#5c442f" stroke-linecap="round">
 <path d="M750 875 C735 730 742 590 750 470 C755 360 748 250 750 105" stroke-width="44"/>
 <path d="M748 520 C650 450 555 385 410 330" stroke-width="28"/>
 <path d="M752 515 C850 445 950 380 1090 330" stroke-width="28"/>
</g>
<g fill="none" stroke="url(#trunk)" stroke-linecap="round" stroke-linejoin="round">
 <path d="M750 875 C735 730 742 590 750 470 C755 360 748 250 750 105" stroke-width="34"/>
 <path d="M748 545 C660 480 555 405 410 350" stroke-width="21"/>
 <path d="M752 545 C840 480 950 405 1090 350" stroke-width="21"/>
 <path d="M748 670 C670 610 590 555 500 520" stroke-width="14"/>
 <path d="M752 670 C830 610 910 555 1000 520" stroke-width="14"/>
 <path d="M750 395 C685 340 610 300 520 270" stroke-width="11"/>
 <path d="M750 395 C815 340 890 300 980 270" stroke-width="11"/>
</g>
<g fill="none" stroke="#9a7957" stroke-linecap="round">
 <path d="M520 270 C485 240 450 215 415 195" stroke-width="7"/>
 <path d="M980 270 C1015 240 1050 215 1085 195" stroke-width="7"/>
 <path d="M410 350 C365 320 330 295 295 265" stroke-width="7"/>
 <path d="M1090 350 C1135 320 1170 295 1205 265" stroke-width="7"/>
 <path d="M500 520 C455 500 415 475 380 440" stroke-width="6"/>
 <path d="M1000 520 C1045 500 1085 475 1120 440" stroke-width="6"/>
</g>
</svg>
<svg class="lines" viewBox="0 0 1500 900" id="lines"></svg><div id="nodes"></div></div>
<div class="profile" id="profile"><div class="big" id="profileAvatar">A</div><h3 id="profileName">Alice Blackwood</h3><div class="small" id="profileGen">II поколение</div><div class="stats"><div class="stat" id="profileInfo"></div><div class="stat" id="profileStatus"></div><div class="stat"><b>Ветка:</b> Blackwood</div></div></div>
<div class="hint">Перетаскивай дерево мышью · Колесо — масштаб</div></section>
</main></div>
<div class="modal" id="modal"><div class="dialog"><h2>Новый сим</h2><p>Добавь персонажа — SIMORA сама поместит его в династию.</p><form class="form" id="form">
<div class="field"><label>Имя</label><input id="firstName" required placeholder="Например, Victoria"></div>
<div class="field"><label>Фамилия</label><input id="lastName" required placeholder="Blackwood"></div>
<div class="field"><label>Поколение</label><select id="generation"><option value="I">I поколение</option><option value="II">II поколение</option><option value="III" selected>III поколение</option><option value="IV">IV поколение</option><option value="V">V поколение</option></select></div>
<div class="field"><label>Статус</label><select id="status"><option>Жива</option><option>Умерла</option></select></div>
<div class="field"><label>Портрет Sims <span class="photo-note">необязательно</span></label><input id="photo" type="file" accept="image/*"></div>
<div class="form-actions"><button type="button" class="action" id="cancelBtn">Отмена</button><button class="action primary">Добавить в дерево</button></div>
</form></div></div>
<script>
const area=document.getElementById('area'),canvas=document.getElementById('canvas'),nodesEl=document.getElementById('nodes'),lines=document.getElementById('lines'),profile=document.getElementById('profile');
const nameEl=document.getElementById('profileName'),genEl=document.getElementById('profileGen'),infoEl=document.getElementById('profileInfo'),statusEl=document.getElementById('profileStatus'),avatarEl=document.getElementById('profileAvatar'),counter=document.getElementById('counter');
const modal=document.getElementById('modal'),form=document.getElementById('form');
let x=0,y=0,scale=1,drag=false,sx=0,sy=0,mode='tree';
const seed=[
{id:'evelyn',first:'Evelyn',last:'Blackwood',gen:'I',status:'Жива',info:'Основательница рода · 2 ребёнка · 7 потомков',x:675,y:72},
{id:'alice',first:'Alice',last:'Blackwood',gen:'II',status:'Жива',info:'Дочь Evelyn · Партнёр: Ryan · 2 ребёнка',x:405,y:350},
{id:'james',first:'James',last:'Blackwood',gen:'II',status:'Жива',info:'Сын Evelyn · Не женат · Карьера: бизнес',x:945,y:350},
{id:'emma',first:'Emma',last:'Blackwood',gen:'III',status:'Жива',info:'Дочь Alice · Амбициозная · Романтичная',x:405,y:625},
{id:'noah',first:'Noah',last:'Blackwood',gen:'III',status:'Жива',info:'Сын Alice · Музыкант · 19 лет',x:675,y:625},
{id:'lily',first:'Lily',last:'Blackwood',gen:'III',status:'Умерла',info:'Дочь James · Умерла в 2024 · Память рода',x:945,y:625}
];
let custom=JSON.parse(localStorage.getItem('simora-custom')||'[]');let people=[...seed,...custom];
function renderPeople(){nodesEl.innerHTML='';lines.innerHTML='';people.forEach((p,i)=>{const el=document.createElement('div');el.className='node '+(p.status==='Умерла'?'dead':'');el.style.left=p.x+'px';el.style.top=p.y+'px';el.dataset.id=p.id;const portrait=p.photo?'<img src="'+p.photo+'" alt="">':'<span class="initial">'+p.first[0]+'</span>';el.innerHTML='<div class="leaf"><svg class="ivy" viewBox="0 0 160 190" aria-hidden="true"><path class="ivy-stem" d="M19 167 C4 145 14 126 24 111 C35 95 27 77 24 61 C20 42 35 22 58 16 C84 9 111 17 128 35 C143 52 146 75 135 94 C124 114 135 135 119 158" /><path class="ivy-tendril" d="M25 111 C45 118 55 130 53 145 M126 91 C109 99 103 113 107 127 M57 17 C63 30 74 36 89 35" /><g class="ivy-leaves"><path d="M20 139 C5 136 2 123 15 117 C25 122 28 131 20 139Z"/><path d="M25 87 C9 82 9 68 23 65 C32 72 32 80 25 87Z"/><path d="M39 34 C25 27 27 14 42 11 C51 20 49 29 39 34Z"/><path d="M69 17 C68 3 81 -2 91 8 C89 19 80 24 69 17Z"/><path d="M111 25 C113 11 126 10 132 21 C127 31 119 34 111 25Z"/><path d="M137 59 C150 53 158 62 153 74 C143 78 136 70 137 59Z"/><path d="M132 108 C146 104 153 114 145 125 C134 126 129 118 132 108Z"/><path d="M116 153 C120 140 133 139 138 150 C132 160 123 162 116 153Z"/><path d="M71 168 C61 158 65 146 78 145 C87 153 84 163 71 168Z"/><path d="M34 151 C21 149 17 137 29 132 C39 137 42 145 34 151Z"/></g></svg><div class="avatar">'+portrait+'</div></div><div class="name">'+p.first+'</div><div class="meta">'+p.gen+' поколение'+(p.status==='Умерла'?' · †':'')+'</div>';el.onclick=()=>selectPerson(p,el);nodesEl.appendChild(el)});drawConnections();counter.textContent=new Set(people.map(p=>p.gen)).size+' поколения · '+people.length+' персонажей'}
function drawPath(d,soft=false,cls='branch'){const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('class',cls+(soft?' twig':''));lines.appendChild(path)}
function drawConnections(){if(people.length<2)return;const by=n=>people.find(p=>p.id===n),e=by('evelyn'),a=by('alice'),j=by('james'),em=by('emma'),no=by('noah'),li=by('lily');drawPath('M750 845 C742 720 758 620 750 510 C744 420 752 300 750 150');if(e&&a)drawPath('M748 335 C700 305 630 275 560 265 C500 256 445 285 392 335');if(e&&j)drawPath('M752 335 C802 302 870 274 944 263 C1005 255 1060 286 1110 334');if(a&&em)drawPath('M392 398 C370 448 365 500 382 548 C392 575 394 594 393 625',true,'branch thin');if(a&&no)drawPath('M410 395 C500 450 600 500 690 555 C720 573 739 592 750 625',true,'branch thin');if(j&&li)drawPath('M1108 397 C1128 452 1134 501 1118 548 C1108 576 1104 597 1102 625',true,'branch thin');drawPath('M548 265 C510 235 465 216 418 207',true,'branch twig');drawPath('M952 264 C995 235 1040 214 1087 203',true,'branch twig');drawPath('M394 334 C340 310 294 277 254 236',true,'branch twig');drawPath('M1107 334 C1160 310 1205 277 1247 235',true,'branch twig');}
function selectPerson(p,el){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));el.classList.add('selected');nameEl.textContent=p.first+' '+p.last;genEl.textContent=p.gen+' поколение';infoEl.textContent=p.info;statusEl.innerHTML='<b>Статус:</b> '+p.status;avatarEl.textContent=p.first[0];profile.classList.add('show')}
function render(){canvas.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`;area.classList.toggle('constellation',mode==='constellation')}
area.addEventListener('mousedown',e=>{if(e.target.closest('.node')||e.target.closest('.profile'))return;drag=true;sx=e.clientX-x;sy=e.clientY-y;area.classList.add('dragging')});window.addEventListener('mousemove',e=>{if(!drag)return;x=e.clientX-sx;y=e.clientY-sy;render()});window.addEventListener('mouseup',()=>{drag=false;area.classList.remove('dragging')});
area.addEventListener('wheel',e=>{e.preventDefault();scale+=e.deltaY<0?.08:-.08;scale=Math.max(.55,Math.min(1.8,scale));render()},{passive:false});
function setView(v){mode=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.getElementById('addBtn').onclick=()=>modal.classList.add('show');document.getElementById('cancelBtn').onclick=()=>modal.classList.remove('show');
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
form.addEventListener('submit',e=>{e.preventDefault();const first=document.getElementById('firstName').value.trim(),last=document.getElementById('lastName').value.trim(),gen=document.getElementById('generation').value,status=document.getElementById('status').value,file=document.getElementById('photo').files[0];const same=people.filter(p=>p.gen===gen).length;const p={id:'custom-'+Date.now(),first,last,gen,status,info:'Новый персонаж династии',x:300+(same%5)*270,y:170+(['I','II','III','IV','V'].indexOf(gen))*135};const save=photo=>{p.photo=photo||'';custom.push(p);localStorage.setItem('simora-custom',JSON.stringify(custom));people=[...seed,...custom];renderPeople();render();modal.classList.remove('show');form.reset()};if(file){const reader=new FileReader();reader.onload=()=>save(reader.result);reader.readAsDataURL(file)}else save('')});
renderPeople();render();
</script>
</body>
</html>
